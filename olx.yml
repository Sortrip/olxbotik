name: OLX bot
on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:
concurrency:
  group: olx-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U aiogram aiohttp beautifulsoup4
      - uses: actions/cache/restore@v4
        with:
          path: olx.db
          key: db-${{ github.run_id }}
          restore-keys: db-
      - run: python olx_bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          ADMIN_ID: ${{ secrets.TG_CHAT_ID }}
          PRICE_STARS: "40"
          SUPPORT: "@AzeiroKok"
          RUN_SECONDS: "19500"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: olx.db
          key: db-${{ github.run_id }}
